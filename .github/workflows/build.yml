name: Build & Attach EXE

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload to (e.g. v1.0.0). Leave blank for dry-run."
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build exe with PyInstaller
        run: python -m PyInstaller --clean --noconfirm ActivityCapture.spec

      - name: Verify exe exists
        run: |
          if (!(Test-Path "dist\ActivityCapture.exe")) {
            Write-Error "Build failed — dist\ActivityCapture.exe not found"
            Get-ChildItem dist -Recurse -ErrorAction SilentlyContinue
            exit 1
          }
          $size = (Get-Item "dist\ActivityCapture.exe").Length
          Write-Output "ActivityCapture.exe built successfully ($size bytes)"

      - name: Upload exe to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/ActivityCapture.exe --repo ${{ github.repository }} --clobber

      - name: Upload exe to specified tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.inputs.tag }}" dist/ActivityCapture.exe --repo ${{ github.repository }} --clobber

      - name: Remove source code archives
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.event.release.tag_name }}" --repo ${{ github.repository }} --json assets --jq '.assets[] | select(.name | startswith("Source code")) | .name' |
          ForEach-Object {
            gh release delete-asset "${{ github.event.release.tag_name }}" "$_" --repo ${{ github.repository }} --yes
          }

      - name: Upload exe as workflow artifact (fallback)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: ActivityCapture
          path: dist/ActivityCapture.exe
